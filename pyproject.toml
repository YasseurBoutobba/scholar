[project]
name = "scholar"
version = "0.1.0"
description = "Production-grade agentic RAG system for academic research"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.15",
    "asyncpg>=0.31",
    "cohere>=5.0",
    "fastapi>=0.115",
    "fastembed>=0.5",
    "feedparser>=6.0",
    "httpx>=0.27",
    "networkx>=3.0",
    "openai>=1.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    "qdrant-client>=1.18",
    "redis>=5.0",
    "requests>=2.31",
    "sentence-transformers>=5.0",
    "sse-starlette>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.63.0",
    "pymupdf4llm>=1.28.2",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "ruff>=0.15",
    "ty>=0.0.48",
]
test = [
    "pytest>=9.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.rules]
all = "warn"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
